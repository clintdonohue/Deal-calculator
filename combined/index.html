<link rel="manifest" href="manifest.webmanifest">
<title>Rate Calculator</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#15212b; --sub:#5f6e7b; --faint:#8b98a4;
  --line:#e2e8ed; --field:#f7f9fa;
  --accent:#0e7c66; --accent-ink:#ffffff; --accent-ring:rgba(14,124,102,.22);
  --shadow:0 1px 2px rgba(16,32,44,.04),0 6px 18px rgba(16,32,44,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1418; --card:#151f25; --ink:#e8eef2; --sub:#9aa8b3; --faint:#71808c;
    --line:#24323b; --field:#1b272e;
    --accent:#3fcf9f; --accent-ink:#06261d; --accent-ring:rgba(63,207,159,.28);
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
input{touch-action:manipulation}
.app{width:100%;max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{margin:0;font-size:22px;line-height:1.2;letter-spacing:-.4px;font-weight:750}
.actions{display:flex;gap:8px;flex:none}
.btn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:650;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn svg{width:16px;height:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card-title{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em}
.hero{padding:18px 18px 16px}
.hero-label{font-size:15px;font-weight:700;color:var(--ink)}
.money{display:flex;align-items:baseline;margin-top:8px;color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap;overflow:hidden}
.money .cur{font-size:34px;font-weight:750;margin-right:2px}
.amt{font-size:56px;letter-spacing:-2px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.pair .lbl{font-size:12px;font-weight:650;color:var(--sub);margin-bottom:2px}
.pair .val{font-size:22px;font-weight:750;letter-spacing:-.3px;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;overflow:hidden}
.pair .val span{color:var(--faint);font-weight:650;margin-right:1px}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.field{display:block;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:13px;padding:10px 12px;min-height:64px;cursor:text;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.field .lbl{display:block;font-size:12px;font-weight:650;color:var(--sub);margin-bottom:4px}
.entry{display:flex;align-items:baseline;gap:3px;min-width:0}
.entry .pre,.entry .suf{flex:none;color:var(--faint);font-weight:600}
.entry .pre{font-size:18px}
.entry .suf{font-size:13px}
.entry input{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;padding:0;font-size:22px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums;line-height:1.2}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:359px){.app{padding-left:10px;padding-right:10px}.card{padding:13px}.btn{padding:0 11px}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>Rate Calculator</h1>
    <div class="actions">
      <button class="btn" type="button" id="reset" aria-label="Reset to example rates">Reset</button>
    </div>
  </header>

  <section class="card hero" aria-label="Total deal spread">
    <div class="hero-label">Total deal spread</div>
    <div class="money" aria-live="polite"><span class="cur" aria-hidden="true">$</span><span class="amt" id="total"></span></div>
  </section>

  <section class="card" aria-label="Rates">
    <div class="card-title">Rates</div>
    <div class="fields">
      <label class="field"><span class="lbl">Pay rate</span><span class="entry"><span class="pre">$</span><input id="pay" data-k="pay" type="text" inputmode="decimal" autocomplete="off"><span class="suf">/hr</span></span></label>
      <label class="field"><span class="lbl">Bill rate</span><span class="entry"><span class="pre">$</span><input id="bill" data-k="bill" type="text" inputmode="decimal" autocomplete="off"><span class="suf">/hr</span></span></label>
      <label class="field"><span class="lbl">Burden</span><span class="entry"><input id="dealBurden" data-k="dealBurden" type="text" inputmode="decimal" autocomplete="off"><span class="suf">%</span></span></label>
      <label class="field"><span class="lbl">Hours</span><span class="entry"><input id="hours" data-k="hours" type="text" inputmode="decimal" autocomplete="off"><span class="suf">hrs</span></span></label>
    </div>
  </section>

  <section class="card hero" aria-label="Weekly cost">
    <div class="hero-label">Weekly difference</div>
    <div class="money" aria-live="polite"><span class="cur" aria-hidden="true">$</span><span class="amt" id="diff"></span></div>
    <div class="pair">
      <div><div class="lbl">Contract / week</div><div class="val"><span aria-hidden="true">$</span><b id="contract"></b></div></div>
      <div><div class="lbl">Full-time / week</div><div class="val"><span aria-hidden="true">$</span><b id="fulltime"></b></div></div>
    </div>
    <div class="pair">
      <div><div class="lbl">Direct hire fee</div><div class="val"><span aria-hidden="true">$</span><b id="directHire"></b></div></div>
      <div><div class="lbl">Contract fee</div><div class="val"><span aria-hidden="true">$</span><b id="contractFee"></b></div></div>
    </div>
  </section>

  <section class="card" aria-label="Weekly inputs">
    <div class="fields">
      <label class="field"><span class="lbl">Annual salary</span><span class="entry"><span class="pre">$</span><input id="salary" data-k="salary" type="text" inputmode="decimal" autocomplete="off"><span class="suf">/yr</span></span></label>
      <label class="field"><span class="lbl">Burden</span><span class="entry"><input id="clientBurden" data-k="clientBurden" type="text" inputmode="decimal" autocomplete="off"><span class="suf">%</span></span></label>
      <label class="field"><span class="lbl">Direct hire fee %</span><span class="entry"><input id="hireFee" data-k="hireFee" type="text" inputmode="decimal" autocomplete="off"><span class="suf">%</span></span></label>
    </div>
  </section>

  <section class="card hero" aria-label="Spread versus direct hire fee">
    <div class="hero-label">Difference</div>
    <div class="money" aria-live="polite"><span class="cur" aria-hidden="true">$</span><span class="amt" id="vsDiff"></span></div>
    <div class="pair">
      <div><div class="lbl">Total deal spread</div><div class="val"><span aria-hidden="true">$</span><b id="vsSpread"></b></div></div>
      <div><div class="lbl">Direct hire fee</div><div class="val"><span aria-hidden="true">$</span><b id="vsHire"></b></div></div>
    </div>
  </section>
</main>

<script>
(function(){
  'use strict';
  var DEFAULTS = {pay:30, bill:50, dealBurden:16, hours:1040, salary:80000, clientBurden:30, hireFee:20};
  var m = {pay:30, bill:50, dealBurden:16, hours:1040, salary:80000, clientBurden:30, hireFee:20};

  // spread/hr = bill − pay × (1 + deal burden); total = spread × hours
  function spread(){ return m.bill - m.pay * (100 + m.dealBurden) / 100; }
  function total(){ return spread() * m.hours; }
  // contract/week = bill × 40; full-time/week = salary / 52 × (1 + burden%)
  function contract(){ return m.bill * 40; }
  function fulltime(){ return m.salary * (100 + m.clientBurden) / 5200; }
  function difference(){ return contract() - fulltime(); }
  function directHire(){ return m.salary * m.hireFee / 100; }
  function contractFee(){ return difference() / 40 * m.hours; }
  function spreadVsHire(){ return total() - directHire(); }

  function ok(n){ return typeof n === 'number' && isFinite(n); }
  function fix(n, min, max){ return ok(n) ? n.toLocaleString('en-US',{minimumFractionDigits:min, maximumFractionDigits:max}) : '—'; }
  function dollars(n){
    if (!ok(n)) return '—';
    var r = Math.round(n);
    return (r < 0 ? '−' : '') + Math.abs(r).toLocaleString('en-US');
  }

  var $ = function(id){ return document.getElementById(id); };
  var inputs = {};
  Array.prototype.forEach.call(document.querySelectorAll('input[data-k]'), function(el){ inputs[el.dataset.k] = el; });

  function fieldText(k){
    switch(k){
      case 'pay': return fix(m.pay,2,2);
      case 'bill': return fix(m.bill,2,2);
      case 'dealBurden': return fix(m.dealBurden,0,2);
      case 'hours': return fix(m.hours,0,2);
      case 'salary': return fix(m.salary,0,2);
      case 'clientBurden': return fix(m.clientBurden,0,2);
      case 'hireFee': return fix(m.hireFee,0,2);
    }
  }

  function fitAmounts(){
    Array.prototype.forEach.call(document.querySelectorAll('.amt'), function(el){
      var len = el.textContent.length;
      var avail = el.parentNode.clientWidth - 30;
      el.style.fontSize = Math.max(30, Math.min(56, avail / (Math.max(len,4) * 0.62))).toFixed(1) + 'px';
    });
  }

  function render(active){
    Object.keys(inputs).forEach(function(k){ if (k !== active) inputs[k].value = fieldText(k); });
    $('total').textContent = dollars(total());
    $('diff').textContent = dollars(difference());
    $('contract').textContent = dollars(contract());
    $('fulltime').textContent = dollars(fulltime());
    $('directHire').textContent = dollars(directHire());
    $('contractFee').textContent = dollars(contractFee());
    $('vsDiff').textContent = dollars(spreadVsHire());
    $('vsSpread').textContent = dollars(total());
    $('vsHire').textContent = dollars(directHire());
    fitAmounts();
  }

  function parse(str){
    var raw = String(str).replace(/[\s$,%]/g,'').replace(/[−–]/g,'-');
    if (raw === '' || raw === '-' || raw === '.' || raw === '-.') return NaN;
    var n = Number(raw);
    return ok(n) ? n : NaN;
  }

  Object.keys(inputs).forEach(function(k){
    var el = inputs[k];
    el.addEventListener('input', function(){
      var v = parse(el.value);
      if (!ok(v)) return;
      m[k] = v;
      render(k);
    });
    el.addEventListener('blur', function(){ render(); });
    el.addEventListener('focus', function(){ var v0 = el.value; setTimeout(function(){ if (document.activeElement === el && el.value === v0) { try { el.select(); } catch(e){} } }, 0); });
    el.addEventListener('keydown', function(e){ if (e.key === 'Enter') el.blur(); });
  });

  $('reset').addEventListener('click', function(){
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    m.pay = DEFAULTS.pay; m.bill = DEFAULTS.bill; m.dealBurden = DEFAULTS.dealBurden; m.hours = DEFAULTS.hours;
    m.salary = DEFAULTS.salary; m.clientBurden = DEFAULTS.clientBurden; m.hireFee = DEFAULTS.hireFee;
    render();
  });

  window.addEventListener('resize', fitAmounts);
  window.__calc = {m:m, spread:spread, total:total, contract:contract, fulltime:fulltime, difference:difference, directHire:directHire, contractFee:contractFee};
  render();
})();
</script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
